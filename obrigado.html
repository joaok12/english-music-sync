<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071225">
  <title>Pagamento concluído • Inglês Cantando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="assets/branding/logo.png" fetchpriority="high">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="obrigado.css?v=1">
</head>
<body>
  <main class="thank-you-page">
    <a class="brand" href="index.html" aria-label="Inglês Cantando, página inicial">
      <img src="assets/branding/logo.png" alt="Inglês Cantando" width="56" height="56" fetchpriority="high">
    </a>

    <section class="thank-you-card" aria-labelledby="thankYouTitle">
      <div class="success-mark" aria-hidden="true"><span>✓</span></div>
      <p class="eyebrow">Pagamento confirmado</p>
      <h1 id="thankYouTitle">Obrigado pela sua compra!</h1>
      <p class="lead">Seu pagamento foi concluído com sucesso. Agora você já pode acessar sua área de membros e começar a cantar.</p>
      <a class="access-button" href="index.html">Acessar plataforma <span aria-hidden="true">→</span></a>
      <p class="hint">Entre usando o mesmo e-mail e CPF informados na compra.</p>
    </section>

    <p class="footer-note">Inglês Cantando • Aprenda cantando</p>
  </main>
</body>
</html>
