<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Inglês Cantando • Karaokê Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5.1">
  <link rel="stylesheet" href="themes.css?v=10">
  <script src="port-redirect.js"></script>
</head>
<body>
  <div class="mobile-app">
    <!-- Topo Criativo de Anúncio / Oferta & Navegação -->
    <header class="app-header">
      <div class="notch-pill"></div>

      <div class="header-content" id="promoHeader">
        <!-- Título com Bandeira dos EUA (clicável para voltar se desejar) -->
        <a href="index.html" class="header-brand" style="text-decoration:none; color:inherit;" title="Voltar para a escolha de músicas">
          <div class="brand-flag-wrap" id="headerTitleIconWrap">
            <svg class="header-flag" viewBox="0 0 32 22" width="24" height="16">
              <defs>
                <clipPath id="header-usa-clip"><rect width="32" height="22" rx="3"/></clipPath>
              </defs>
              <g clip-path="url(#header-usa-clip)">
                <rect width="32" height="22" fill="#ffffff"/>
                <rect y="0" width="32" height="1.69" fill="#b22234"/>
                <rect y="3.38" width="32" height="1.69" fill="#b22234"/>
                <rect y="6.77" width="32" height="1.69" fill="#b22234"/>
                <rect y="10.15" width="32" height="1.69" fill="#b22234"/>
                <rect y="13.54" width="32" height="1.69" fill="#b22234"/>
                <rect y="16.92" width="32" height="1.69" fill="#b22234"/>
                <rect y="20.31" width="32" height="1.69" fill="#b22234"/>
                <rect width="13.5" height="11.85" fill="#3c3b6e"/>
                <g fill="#ffffff" opacity="0.9">
                  <circle cx="3" cy="2.5" r="0.7"/>
                  <circle cx="7" cy="2.5" r="0.7"/>
                  <circle cx="11" cy="2.5" r="0.7"/>
                  <circle cx="5" cy="5.5" r="0.7"/>
                  <circle cx="9" cy="5.5" r="0.7"/>
                  <circle cx="3" cy="8.5" r="0.7"/>
                  <circle cx="7" cy="8.5" r="0.7"/>
                  <circle cx="11" cy="8.5" r="0.7"/>
                </g>
              </g>
            </svg>
          </div>
          <div class="header-copy">
            <h1 class="header-main-title">Aprenda Inglês Cantando</h1>
            <p id="headerSubtitle" class="header-subtitle" hidden></p>
          </div>
        </a>

        <!-- Ancoragem de Preço e Oferta de Venda -->
        <div class="header-offer-badge">
          <span class="price-old">De R$ 97</span>
          <span class="price-divider"></span>
          <span class="price-new">Por apenas <strong>R$ 27,90</strong></span>
        </div>
      </div>
      <a href="index.html" id="songOnlyHeader" class="song-only-header" hidden aria-label="Voltar para a escolha de músicas">
        <span class="song-header-back" aria-hidden="true">‹</span>
        <h1 id="songHeaderTitle">Música</h1>
      </a>
      <button type="button" class="settings-trigger" id="openSettings" aria-label="Configurações de temas e visualização" title="Configurações" aria-haspopup="dialog">
        <svg class="settings-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.37-.31-.6-.22l-2.49 1a7.94 7.94 0 0 0-1.69-.98l-.38-2.65A.51.51 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.38 2.65c-.61.25-1.18.59-1.69.98l-2.49-1c-.23-.08-.48 0-.6.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.08.65-.08.98s.03.66.08.98l-2.11 1.65c-.19.15-.25.42-.12.64l2 3.46c.12.22.37.31.6.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.18-.58 1.69-.98l2.49 1c.23.08.48 0 .6-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
      </button>
    </header>

    <!-- Setinha Superior Aumentada e Posicionada Próxima à Palavra -->
    <div class="karaoke-pointer" id="karaokePointer">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 18l-7-7h14l-7 7z"/>
      </svg>
    </div>

    <!-- Área de Rolagem das Letras -->
    <main class="lyrics-viewport" id="lyricsViewport">
      <div class="scroll-pad-top"></div>
      <div class="lyrics-stream" id="lyricsStream"></div>
      <div class="scroll-pad-bottom"></div>
    </main>

    <!-- Player Fixo Inferior Mobile -->
    <footer class="player-bar">
      <!-- Barra de Progresso Fina -->
      <div class="timeline-hitbox" id="timelineHitbox">
        <div class="timeline-rail">
          <div class="timeline-fill" id="timelineFill"></div>
        </div>
      </div>

      <div class="time-display">
        <span id="labelCurrent">0:00</span>
        <span id="labelRemaining">-3:00</span>
      </div>

      <!-- Controles Minimalistas -->
      <div class="player-buttons">
        <button class="btn-action" id="btnBack" aria-label="Voltar 5 segundos">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.5 8.5V4L4 12l8.5 8v-4.5c6 0 9.5 3 10.5 7.5-.5-6-3-14-10.5-14.5z"/>
          </svg>
        </button>

        <button class="btn-play-main" id="btnPlay" aria-label="Tocar ou Pausar">
          <svg class="svg-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l11-6.86a1 1 0 0 0 0-1.68l-11-6.86A1 1 0 0 0 8 5.14z"/>
          </svg>
          <svg class="svg-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <button class="btn-action" id="btnFwd" aria-label="Avançar 5 segundos">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.5 8.5V4L20 12l-8.5 8v-4.5C5.5 15.5 2 18.5 1 23c.5-6 3-14 10.5-14.5z"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <dialog id="appearanceSettings" class="appearance-settings" aria-labelledby="settingsTitle">
    <div class="settings-heading"><h2 id="settingsTitle">Configurações</h2><button id="closeSettings" type="button" aria-label="Fechar configurações">✕</button></div>
    <fieldset class="theme-picker"><legend class="sr-only">Tema do karaokê</legend>
      <label class="theme-option"><input type="radio" name="karaokeTheme" value="usa-claro"><span class="theme-swatch" aria-hidden="true" style="--swatch-bg:#ffffff;--swatch-highlight:#c1121f"></span><span>USA Claro</span></label>
      <label class="theme-option"><input type="radio" name="karaokeTheme" value="usa-blur"><span class="theme-swatch" aria-hidden="true" style="--swatch-bg:#0b1220;--swatch-highlight:#ffffff"></span><span>USA Blur</span></label>
      <label class="theme-option"><input type="radio" name="karaokeTheme" value="original" checked><span class="theme-swatch" aria-hidden="true" style="--swatch-bg:#0c1224;--swatch-highlight:#ef4444"></span><span>Original</span></label>
      <label class="theme-option"><input type="radio" name="karaokeTheme" value="aurora"><span class="theme-swatch" aria-hidden="true" style="--swatch-bg:#15102b;--swatch-highlight:#e5a1ff"></span><span>Aurora</span></label>
      <label class="theme-option"><input type="radio" name="karaokeTheme" value="oceano"><span class="theme-swatch" aria-hidden="true" style="--swatch-bg:#062532;--swatch-highlight:#67e8f9"></span><span>Oceano</span></label>
      <label class="theme-option"><input type="radio" name="karaokeTheme" value="floresta"><span class="theme-swatch" aria-hidden="true" style="--swatch-bg:#10251b;--swatch-highlight:#bef264"></span><span>Floresta</span></label>
      <label class="theme-option"><input type="radio" name="karaokeTheme" value="ambar"><span class="theme-swatch" aria-hidden="true" style="--swatch-bg:#2d1913;--swatch-highlight:#fcd58d"></span><span>Âmbar</span></label>
    </fieldset>
    <fieldset id="adminPricingSettings" class="header-picker" hidden><legend class="sr-only">Oferta no topo</legend><label><input type="checkbox" id="showPromo"> Mostrar preço no topo</label></fieldset>
    <fieldset id="adminCreativeSettings" class="creative-picker" hidden>
      <legend>Controles do criativo</legend>
      <div class="header-copy-editor">
        <p class="creative-section-label">Texto do topo</p>
        <label class="text-control" for="headerTitleIcon"><span>Ícone</span><input id="headerTitleIcon" type="text" value="🇺🇸" maxlength="8" inputmode="text" autocomplete="off"></label>
        <label class="text-control" for="headerTitleText"><span>Título</span><input id="headerTitleText" type="text" value="Aprenda Inglês Cantando" maxlength="100" autocomplete="off"></label>
        <label class="text-control" for="headerSubtitleText"><span>Legenda</span><textarea id="headerSubtitleText" rows="2" maxlength="180" placeholder="Ex.: Aprenda as frases que você realmente vai usar."></textarea></label>
      </div>
      <label class="range-control" for="glowSize">
        <span><span>Glow do destaque</span><output id="glowSizeValue" for="glowSize">20px</output></span>
        <input id="glowSize" type="range" min="0" max="60" step="1" value="20">
      </label>
      <label class="range-control" for="backgroundBlur">
        <span><span>Blur do fundo preto</span><output id="backgroundBlurValue" for="backgroundBlur">32px</output></span>
        <input id="backgroundBlur" type="range" min="0" max="60" step="1" value="32">
      </label>
      <label class="range-control" for="backgroundHeight">
        <span><span>Altura do fundo preto</span><output id="backgroundHeightValue" for="backgroundHeight">130px</output></span>
        <input id="backgroundHeight" type="range" min="40" max="260" step="1" value="130">
      </label>
      <label class="range-control" for="headerOffset">
        <span><span>Altura do título + preço</span><output id="headerOffsetValue" for="headerOffset">0px</output></span>
        <input id="headerOffset" type="range" min="-24" max="96" step="1" value="0">
      </label>
      <div class="creative-actions"><button id="resetCreativeSettings" type="button">Restaurar</button><span id="creativeSaveStatus" role="status" aria-live="polite"></span></div>
    </fieldset>
  </dialog>

  <audio id="audioTrack" preload="auto">
    <source id="audioSource" src="audio.mp3" type="audio/mpeg">
  </audio>

  <script src="songs-data.js?v=5.0"></script>
  <script src="sync-store.js"></script>
  <script src="custom-songs.js?v=6.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="remote-song.js?v=1"></script>
  <script src="script.js?v=5.3"></script>
  <script src="appearance.js?v=8"></script>
</body>
</html>
