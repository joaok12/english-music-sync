<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Área de membros • Inglês Cantando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="member-home.css?v=10">
  <script src="port-redirect.js"></script>
</head>
<body class="member-home">
  <div class="member-app">
    <section id="memberLoginView" class="member-login-view" aria-labelledby="memberLoginTitle">
      <header class="minimal-header">
        <a href="index.html" aria-label="Inglês Cantando, início"><img class="site-logo" src="assets/branding/logo.png" alt="Inglês Cantando"></a>
      </header>
      <div class="auth-wrap">
        <div class="login-panel">
          <img class="login-logo" src="assets/branding/logo.png" alt="Inglês Cantando">
          <h1 id="memberLoginTitle">Entrar</h1>
          <form id="memberLoginForm" class="member-login-form" novalidate>
            <label for="memberEmail">E-mail</label>
            <input id="memberEmail" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
            <label for="memberCpf">CPF</label>
            <input id="memberCpf" name="cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" required>
            <button class="member-cta" type="submit">Entrar <span>→</span></button>
          </form>
          <p id="loginStatus" class="member-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section id="memberLibraryView" class="member-library-view" hidden>
      <header class="member-nav">
        <div class="member-nav-left">
          <a href="index.html" aria-label="Inglês Cantando, início"><img class="site-logo" src="assets/branding/logo.png" alt="Inglês Cantando"></a>
          <nav class="member-nav-links" aria-label="Navegação da biblioteca">
            <a class="is-active" href="#playlists">Playlists</a>
          </nav>
        </div>
        <div class="member-nav-actions"><span id="memberGreeting" class="member-greeting"></span><button id="memberLogout" class="member-logout" type="button">Sair</button></div>
      </header>
      <main class="member-library-main">
        <section id="playlists" class="playlist-collections" aria-labelledby="playlistCollectionsTitle">
          <div class="playlist-collections-heading">
            <div><p class="section-kicker">PLAYLISTS</p><h2 id="playlistCollectionsTitle">Escolha uma playlist</h2></div>
          </div>
          <div id="playlistCollectionsRail" class="playlist-collections-rail"></div>
        </section>

        <section id="playlistDetail" class="playlist-detail" hidden aria-labelledby="playlistDetailTitle">
          <button id="playlistBack" class="playlist-back" type="button">← Voltar para playlists</button>
          <div class="playlist-detail-header">
            <div>
              <p class="section-kicker">PLAYLIST</p>
              <h2 id="playlistDetailTitle">Playlist</h2>
              <p id="playlistDetailSubtitle" class="playlist-detail-subtitle"></p>
            </div>
            <div class="playlist-detail-meta"><strong id="playlistCount">0</strong><span>músicas</span></div>
          </div>
          <p id="playlistDetailStatus" class="member-status" role="status" aria-live="polite"></p>
          <div id="memberPlaylist" class="playlist-list"></div>
        </section>

        <section id="memberOffersSection" class="catalog-section offers-section" aria-labelledby="offersTitle"><div class="catalog-heading"><h2 id="offersTitle">Outras playlists</h2></div><div id="memberOffersRail" class="offers-rail"></div></section>
      </main>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="member-home.js?v=11"></script>
</body>
</html>
