<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Área de membros • Inglês Cantando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="member-home.css?v=4">
  <script src="port-redirect.js"></script>
</head>
<body class="member-home">
  <div class="member-app">
    <section id="memberLoginView" class="member-login-view" aria-labelledby="memberLoginTitle">
      <header class="minimal-header">
        <a href="index.html" aria-label="Inglês Cantando, início"><img class="site-logo" src="assets/branding/logo.png" alt="Inglês Cantando"></a>
      </header>
      <div class="auth-wrap">
        <div class="login-panel">
          <img class="login-logo" src="assets/branding/logo.png" alt="Inglês Cantando">
          <h1 id="memberLoginTitle">Entrar</h1>
          <form id="memberLoginForm" class="member-login-form" novalidate>
            <label for="memberEmail">E-mail</label>
            <input id="memberEmail" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
            <label for="memberCpf">CPF</label>
            <input id="memberCpf" name="cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" required>
            <button class="member-cta" type="submit">Entrar <span>→</span></button>
          </form>
          <p id="loginStatus" class="member-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <section id="memberLibraryView" class="member-library-view" hidden>
      <header class="member-nav">
        <div class="member-nav-left">
          <a href="index.html" aria-label="Inglês Cantando, início"><img class="site-logo" src="assets/branding/logo.png" alt="Inglês Cantando"></a>
          <nav class="member-nav-links" aria-label="Navegação da biblioteca">
            <a class="is-active" href="#playlist">Minha playlist</a>
          </nav>
        </div>
        <div class="member-nav-actions"><span id="memberGreeting" class="member-greeting"></span><button id="memberLogout" class="member-logout" type="button">Sair</button></div>
      </header>
      <main class="member-library-main">
        <section id="memberHero" class="member-hero" aria-labelledby="memberHeroTitle">
          <div class="member-hero-copy">
            <p class="hero-kicker">INGLÊS CANTANDO</p>
            <h1 id="memberHeroTitle">Sua próxima música</h1>
            <p id="memberHeroSubtitle" class="hero-subtitle">Escolha uma música da sua playlist para começar.</p>
            <div class="hero-meta"><span id="memberHeroMeta">Sua biblioteca</span></div>
            <a id="memberHeroPlay" class="hero-play" href="#playlist">🎤 Cantar agora <span aria-hidden="true">→</span></a>
          </div>
          <div id="memberHeroArt" class="member-hero-art" aria-hidden="true">
            <img id="memberHeroCover" alt="">
            <span id="memberHeroFallback" class="hero-fallback">🎵</span>
          </div>
        </section>

        <section id="playlist" class="member-content-grid" aria-label="Biblioteca e playlist">
          <div class="playlist-column">
            <div class="library-title-row">
              <div><p class="section-kicker">SPOTIFY MODE</p><h2>Sua playlist</h2></div>
              <p id="libraryStatus" class="member-status" role="status" aria-live="polite">Carregando…</p>
            </div>
            <div id="memberPlaylist" class="playlist-list"></div>
          </div>
          <aside class="playlist-aside" aria-label="Resumo da biblioteca">
            <span class="aside-label">MINHA BIBLIOTECA</span>
            <strong id="playlistCount">0</strong>
            <span class="aside-caption">músicas liberadas</span>
            <div class="aside-rule"></div>
            <p>Escolha uma faixa e pratique no seu ritmo.</p>
          </aside>
        </section>

        <section class="catalog-section" aria-labelledby="catalogTitle"><div class="catalog-heading"><h2 id="catalogTitle">Explorar</h2></div><div id="memberCatalogRail" class="catalog-rail"></div></section>
        <section id="memberOffersSection" class="catalog-section offers-section" aria-labelledby="offersTitle"><div class="catalog-heading"><h2 id="offersTitle">Mais músicas</h2></div><div id="memberOffersRail" class="offers-rail"></div></section>
      </main>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="member-home.js?v=4"></script>
</body>
</html>
